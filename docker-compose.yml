# Local PostgreSQL for Designer's Street (Phase 1)
# Start: docker compose up -d
# Stop:  docker compose down

services:
  db:
    image: postgres:16-alpine
    container_name: designers-street-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: designers
      POSTGRES_PASSWORD: designers
      POSTGRES_DB: designers_street
    volumes:
      - designers_street_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U designers -d designers_street"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  designers_street_pg:
